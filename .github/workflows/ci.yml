name: ci

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Echo Node node-version
        run: node --version

      - name: Log out some bs 
        run: node -e 'console.log("Log ts bitch")'

      - name: Install Dependencies
        run: npm ci

      - name: Run tests
        run: npm run test
